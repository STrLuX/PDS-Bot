app = 'pds-bot'
primary_region = 'iad'

[build]

[env]
  PORT = '3000'
  CHROMIUM_PATH = '/usr/bin/chromium'
  WWEBJS_AUTH_PATH = '/data/.wwebjs_auth'

[mounts]
  source = 'pds_bot_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '10s'
  timeout = '10s'
  grace_period = '60s'
  method = 'GET'
  path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
