# fly.toml app configuration file generated for pds-bot on 2026-07-11T13:41:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pds-bot'
primary_region = 'iad'

[build]

[env]
  CHROMIUM_PATH = '/usr/bin/chromium'
  PORT = '3000'
  WWEBJS_AUTH_PATH = '/data/.wwebjs_auth'

[[mounts]]
  source = 'pds_bot_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
